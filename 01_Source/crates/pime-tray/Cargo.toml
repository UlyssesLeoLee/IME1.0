# The resident tray of the input method: the logo in the corner, the one-key switch between input methods and the
# voice input.
#
# Deliberately NOT a member of the main workspace: it needs `unsafe` (Win32), it has its own Cargo.lock, and the
# `windows` crate is pinned to 0.58 like `pime-tsf` (see docs/VERSIONS.md).
[package]
name = "pime-tray"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Programming IME resident tray: the logo, the one-key input method switch and the voice input"

[dependencies]
pime-core = { path = "../pime-core" }
pime-tsf = { path = "../pime-tsf" }

[dependencies.windows]
version = "=0.58.0"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[workspace]

# The Windows text-service DLL (TSF text input processor), written in Rust.
# Deliberately NOT a member of the main workspace: it needs `unsafe` (COM), it has its own Cargo.lock, and the
# `windows` crate is pinned to 0.58 because 0.60+ import Windows functions with raw-dylib, which needs a real
# binutils `dlltool`/`as` on the x86_64-pc-windows-gnu toolchain (not installed here). 0.58 ships prebuilt import
# libraries, so no MSVC, Windows SDK or binutils is needed. See docs/VERSIONS.md.
[package]
name = "pime-tsf"
version = "0.3.2"
edition = "2024"
license = "MIT"
publish = false
# The integration test scripts live in 01_Source/tests/tsf (one home for every test script, like tests/rust for
# pime-core and tests/setup for pime-setup). autotests = false keeps cargo from looking anywhere else.
autotests = false
description = "Programming IME text service (TSF) in Rust: in-process input state machine from pime-core"

[lib]
# "rlib" as well as "cdylib": the integration test scripts under 01_Source/tests/tsf link the crate as a library.
# The shipped artefact is still the cdylib (the DLL); the rlib is never packaged.
crate-type = ["cdylib", "rlib"]

[[test]]
name = "ime_scenarios"
path = "../../tests/tsf/ime_scenarios.rs"

[[test]]
name = "ime_functions"
path = "../../tests/tsf/ime_functions.rs"

[[test]]
name = "ime_host"
path = "../../tests/tsf/ime_host.rs"

[[test]]
name = "ime_selection"
path = "../../tests/tsf/ime_selection.rs"

[dependencies]
pime-core = { path = "../pime-core" }
# The privacy and the safety rules of TASE are shared: the text service asks the same policy the extension and the
# agents obey, so the three sides cannot drift apart (DD-IME sections 20.2 and 20.3).
tase-ime-core = { path = "../tase-ime-core" }

[dependencies.windows]
version = "=0.58.0"
features = [
  "implement",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_TextServices",
  "Win32_UI_Input_KeyboardAndMouse",
  # superset for the parallel work items (candidate window, registration, edit sessions): unused features cost nothing
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_Globalization",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  # the clipboard (the row 「剪贴板」 of the panel reads the text that was copied)
  "Win32_System_DataExchange",
  "Win32_System_Memory",
]

[dependencies.windows-core]
version = "=0.58.0"

# The integration test scripts under 01_Source/tests/tsf need the same COM interfaces the crate itself uses.
[dev-dependencies]
windows = { version = "=0.58.0", features = [
  "implement",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# "unwind", not "abort": every COM entry point catches panics (see `tip::guard`); an abort would kill the host application
panic = "unwind"
strip = true

[workspace]
